<nav aria-label="Nawigacja główna">
  <div class="relative flex h-16 items-center justify-between">
    <div class="absolute inset-y-0 left-0 flex items-center lg:hidden">
      <button
        class="btn btn-circle swap swap-rotate"
        [class.swap-active]="showMenu()"
        aria-label="Menu nawigacyjne"
        [attr.aria-expanded]="showMenu()"
        aria-controls="mobile-navigation"
        (click)="toggleMenu()"
      >
        <svg
          class="swap-off fill-current"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 512 512"
        >
          <path
            d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z"
          />
        </svg>
        <svg
          class="swap-on fill-current"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 512 512"
        >
          <polygon
            points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49"
          />
        </svg>
      </button>
    </div>
    <div
      class="flex min-w-0 flex-1 items-center justify-center px-12 lg:justify-start lg:px-0"
    >
      <div class="flex shrink-0 items-center">
        <a
          class="brand-link"
          routerLink="/"
          aria-label="Oszczędzify — strona główna"
          (click)="showMenu.set(false)"
        >
          <img
            class="brand-logo"
            src="/brand/logo-dark.svg"
            alt="Oszczędzify"
            width="589"
            height="112"
          />
        </a>
      </div>
      <div class="hidden lg:ml-6 lg:block">
        <pf-navigation [desktop]="true" />
      </div>
    </div>
  </div>

  <div
    id="mobile-navigation"
    class="lg:hidden expandable"
    [class.expanded]="showMenu()"
    [inert]="!showMenu()"
  >
    <pf-navigation class="expandable-inner" (navigated)="showMenu.set(false)" />
  </div>
</nav>
