@if (desktop()) {
  <ul class="menu hidden lg:flex lg:menu-horizontal">
    @for (item of items; track $index) {
      <li>
        <a
          class="btn btn-ghost text-lg"
          [routerLinkActive]="'text-secondary'"
          [routerLinkActiveOptions]="{ exact: item.directMatch ?? false }"
          [routerLink]="item.link"
          ariaCurrentWhenActive="page"
          (click)="navigated.emit()"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
} @else {
  <ul class="menu mobile-navigation-menu menu-lg lg:hidden">
    @for (item of items; track $index) {
      <li>
        @if (item.items) {
          <button
            (click)="item.open.set(!item.open())"
            [attr.aria-expanded]="item.open()"
          >
            {{ item.label }}
          </button>

          <ul
            class="max-h-0 overflow-hidden transition-all ease-in-out duration-500"
            [style.maxHeight.px]="
              item.open() ? item.items.length * item.itemHeight : 0
            "
            [inert]="!item.open()"
          >
            @for (subitem of item.items; track $index) {
              <li>
                <a
                  [routerLinkActive]="'text-secondary'"
                  [routerLink]="subitem.link"
                  ariaCurrentWhenActive="page"
                  (click)="navigated.emit()"
                >
                  {{ subitem.label }}
                </a>
              </li>
            }
          </ul>
        } @else {
          <a
            [routerLinkActive]="'text-secondary'"
            [routerLinkActiveOptions]="{ exact: item.directMatch ?? false }"
            [routerLink]="item.link"
            ariaCurrentWhenActive="page"
            (click)="navigated.emit()"
          >
            {{ item.label }}
          </a>
        }
      </li>
    }
  </ul>
}
