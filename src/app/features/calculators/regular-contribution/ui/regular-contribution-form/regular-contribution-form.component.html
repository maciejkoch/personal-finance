<form novalidate (submit)="$event.preventDefault()">
  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm">Twoja miesięczna składka</span>
      <span class="text-xs">(zł)</span>
    </div>
    <input
      type="number"
      placeholder="1000"
      class="input input-primary w-full text-base px-4"
      [formField]="form.contribution"
    />
  </label>

  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm">Okres</span>
      <span class="text-xs">(lat)</span>
    </div>
    <input
      type="number"
      class="input input-primary w-full text-base px-4"
      placeholder="10"
      [formField]="form.duration"
    />
  </label>

  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm"> Stopa zwrotu</span>
      <span class="text-xs">(%)</span>
    </div>
    <input
      type="number"
      class="input input-primary w-full text-base px-4"
      placeholder="10"
      [formField]="form.rate"
    />
  </label>

  <label class="flex items-center mt-4">
    <input
      type="checkbox"
      class="toggle toggle-primary"
      [formField]="form.skipRate"
    />
    <span class="ml-2">Pomiń stopę zwrotu</span>
  </label>

  <label class="flex items-center mt-4">
    <input
      type="checkbox"
      class="toggle toggle-primary"
      [formField]="form.skipTax"
    />
    <span class="ml-2">Pomiń podatek Belki</span>
  </label>
  @if (form().invalid()) {
    <p class="text-error mt-3" role="alert">
      Podaj poprawne wartości: kwota co najmniej 1 zł, okres od 1 do 100 lat,
      stopy procentowe od 0 do 100%.
    </p>
  }
</form>
