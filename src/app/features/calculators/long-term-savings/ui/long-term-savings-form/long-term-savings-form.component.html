<form novalidate (submit)="$event.preventDefault()">
  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm">Twój cel</span>
      <span class="text-xs">(zł)</span>
    </div>
    <input
      type="number"
      placeholder="1000"
      class="input input-primary w-full text-base px-4"
      [formField]="form.amount"
    />
  </label>

  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm">Okres</span>
      <span class="text-xs">(lat)</span>
    </div>
    <input
      type="number"
      class="input input-primary w-full text-base px-4"
      placeholder="10"
      [formField]="form.duration"
    />
  </label>

  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm"> Szacowana inflacja</span>
      <span class="text-xs">(%)</span>
    </div>
    <input
      type="number"
      class="input input-primary w-full text-base px-4"
      placeholder="3.5"
      [formField]="form.inflation"
    />
  </label>

  <label class="flex items-center gap-3 mt-4">
    <input
      type="checkbox"
      class="checkbox checkbox-primary"
      [formField]="form.skipInflation"
    />
    <span>Pomiń inflację</span>
  </label>

  <label class="flex flex-col w-full">
    <div class="flex justify-between items-center px-1 py-2">
      <span class="text-sm"> Stopa zwrotu</span>
      <span class="text-xs">(%)</span>
    </div>
    <input
      type="number"
      class="input input-primary w-full text-base px-4"
      placeholder="10"
      [formField]="form.rate"
    />
  </label>

  <label class="flex items-center gap-3 mt-4">
    <input
      type="checkbox"
      class="checkbox checkbox-primary"
      [formField]="form.skipRate"
    />
    <span>Pomiń stopę zwrotu</span>
  </label>

  <pf-tax-options [skipTax]="form.skipTax" />
  @if (form().invalid()) {
    <p class="text-error mt-3" role="alert">
      Podaj poprawne wartości: kwota co najmniej 1 zł, okres w pełnych latach od
      1 do 100, stopy procentowe od 0 do 100%.
    </p>
  }
</form>
