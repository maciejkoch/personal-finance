<form novalidate (submit)="$event.preventDefault()">
  <label class="form-control w-full">
    <div class="label">
      <span class="label-text">Twój cel</span>
      <span class="label-text-alt">(zł)</span>
    </div>
    <input
      type="number"
      placeholder="1000"
      class="input input-bordered input-primary"
      [formField]="form.amount"
    />
  </label>

  <label class="form-control w-full">
    <div class="label">
      <span class="label-text">Okres</span>
      <span class="label-text-alt">(lat)</span>
    </div>
    <input
      type="number"
      class="input input-bordered input-primary"
      placeholder="10"
      [formField]="form.duration"
    />
  </label>

  <label class="form-control w-full">
    <div class="label">
      <span class="label-text"> Szacowana inflacja</span>
      <span class="label-text-alt">(%)</span>
    </div>
    <input
      type="number"
      class="input input-bordered input-primary"
      placeholder="3.5"
      [formField]="form.inflation"
    />
  </label>

  <label class="flex items-center mt-4">
    <input
      type="checkbox"
      class="toggle toggle-primary"
      [formField]="form.skipInflation"
    />
    <span class="ml-2">Pomiń inflację</span>
  </label>

  <label class="form-control w-full">
    <div class="label">
      <span class="label-text"> Stopa zwrotu</span>
      <span class="label-text-alt">(%)</span>
    </div>
    <input
      type="number"
      class="input input-bordered input-primary"
      placeholder="10"
      [formField]="form.rate"
    />
  </label>

  <label class="flex items-center mt-4">
    <input
      type="checkbox"
      class="toggle toggle-primary"
      [formField]="form.skipRate"
    />
    <span class="ml-2">Pomiń stopę zwrotu</span>
  </label>

  <label class="flex items-center mt-4">
    <input
      type="checkbox"
      class="toggle toggle-primary"
      [formField]="form.skipTax"
    />
    <span class="ml-2">Pomiń podatek Belki</span>
  </label>
  @if (form().invalid()) {
    <p class="text-error mt-3" role="alert">
      Podaj poprawne wartości: kwota co najmniej 1 zł, okres od 1 do 100 lat,
      stopy procentowe od 0 do 100%.
    </p>
  }
</form>
