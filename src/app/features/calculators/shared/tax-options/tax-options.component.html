<label
  class="flex items-center gap-3 my-4"
  [class.opacity-60]="skipTax()().disabled()"
>
  <input
    type="checkbox"
    class="checkbox checkbox-primary"
    [formField]="skipTax()"
  />
  <span>Pomiń podatek Belki</span>
</label>
<p class="text-sm mb-3">
  Opcja pokazuje wynik bez podatku od zysków kapitałowych. Służy porównaniu
  scenariuszy i nie potwierdza prawa do zwolnienia podatkowego.
</p>
<a [href]="helpHref()" class="link text-sm">Jak to się ma do IKE?</a>
